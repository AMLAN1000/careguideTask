name: CI/CD Pipeline - Deploy CareGuide Backend to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: 🧪 Continuous Integration (Typecheck & Build)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: ⚙️ Build TypeScript to dist/
        run: npm run build

  deploy:
    name: 🚀 Continuous Deployment to VPS (Port 6565)
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🔑 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            
            # Navigate to project directory on VPS (Create if not existing)
            mkdir -p /var/www/ONLY_NODE_JS/careguideTask
            cd /var/www/ONLY_NODE_JS/careguideTask
            
            # If git repo not initialized on VPS, clone it, otherwise pull latest
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
            else
              echo "Fetching latest changes..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Inject production environment variables
            cat << 'EOF' > .env
            NODE_ENV=production
            PORT=5000
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            BCRYPT_SALT_ROUNDS=${{ secrets.BCRYPT_SALT_ROUNDS || 12 }}
            JWT_SECRET="${{ secrets.JWT_SECRET }}"
            EXPIRES_IN="${{ secrets.EXPIRES_IN || '60d' }}"
            EOF

            # Build and restart Docker container mapped to host port 6565
            echo "Building and launching Docker containers..."
            docker compose up -d --build

            # Clean up old unused Docker images
            docker image prune -f

            echo "✅ Deployment successful! Service running on port 6565."
